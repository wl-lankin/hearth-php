name: manifest

# Weekly: builds macOS PHP for every minor with a new patch, regenerates the catalog and publishes
# manifest.json + manifest.json.sig (plus the CA bundle and the macOS entry list) to the release
# "manifest". Hearth reads releases/download/manifest/manifest.json.

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

# One publish at a time: overlapping runs could upload a manifest and a signature that do not belong
# together.
concurrency:
  group: manifest
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    # Only reads php.net and this repo's releases.
    permissions:
      contents: read
    outputs:
      minors: ${{ steps.plan.outputs.minors }}
      services: ${{ steps.services.outputs.builds }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "minors=$(node scripts/plan.mjs)" >> "$GITHUB_OUTPUT"
      - id: services
        env:
          GH_TOKEN: ${{ github.token }}
        # Redis and MariaDB versions without both macOS builds yet (services-macos.yml).
        run: echo "builds=$(node scripts/services-macos.mjs plan)" >> "$GITHUB_OUTPUT"

  macos:
    needs: plan
    if: needs.plan.outputs.minors != '[]'
    uses: ./.github/workflows/macos.yml
    with:
      minors: ${{ needs.plan.outputs.minors }}

  services:
    needs: plan
    if: needs.plan.outputs.services != '[]'
    uses: ./.github/workflows/services-macos.yml
    with:
      builds: ${{ needs.plan.outputs.services }}

  publish:
    needs: [plan, macos, services]
    # Also runs when no macOS build was needed or one failed: the macOS entries come from the
    # releases, so a failed build only leaves its version out until the next run.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: macOS entries
        env:
          # The releases are the source of truth: every php-<version> release with macOS archives,
          # hashed here. The token goes to the GitHub API only (headersFor).
          GH_TOKEN: ${{ github.token }}
        run: node scripts/macos-entry.mjs releases macos-entries.json
      - name: Own macOS service builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/services-macos.mjs releases services-macos-entries.json
      - name: Generate the catalog
        env:
          # Only for GitHub API calls (Caddy's release); generate.mjs sends it to api.github.com only.
          GH_TOKEN: ${{ github.token }}
        run: node scripts/generate.mjs
      - name: Sign
        env:
          HEARTH_PHP_SIGNING_KEY: ${{ secrets.HEARTH_PHP_SIGNING_KEY }}
          HEARTH_PHP_SIGNING_KEY_PASSWORD: ${{ secrets.HEARTH_PHP_SIGNING_KEY_PASSWORD }}
        run: node scripts/sign.mjs
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp macos-entries.json dist/
          gh release view manifest >/dev/null 2>&1 \
            || gh release create manifest --title "PHP catalog" --notes "The signed catalog Hearth installs PHP from. Updated weekly." --latest=false
          gh release upload manifest dist/manifest.json dist/manifest.json.sig dist/macos-entries.json dist/cacert-*.pem --clobber
