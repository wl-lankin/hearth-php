name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  # The macOS service builds take long; they run on pull requests that change them.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.diff.outputs.builds }}
      php: ${{ steps.diff.outputs.php }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        run: |
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          php=false
          if echo "$changed" | grep -qE '^(\.github/workflows/macos\.yml|build/extensions\.txt|scripts/macos-entry\.mjs)$'; then
            php=true
          fi
          echo "php=${php}" >> "$GITHUB_OUTPUT"
          builds="[]"
          if echo "$changed" | grep -qE '^(scripts/build-|scripts/services-macos|\.github/workflows/services-macos)'; then
            redis="$(curl -fsSL https://api.github.com/repos/redis/redis/releases/latest | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).tag_name))')"
            mariadb="$(node -e 'console.log(JSON.parse(require("fs").readFileSync("pins.json","utf8")).services.mariadb[0])')"
            builds="[{\"kind\":\"redis\",\"version\":\"${redis}\"},{\"kind\":\"mariadb\",\"version\":\"${mariadb}\"}]"
          fi
          echo "builds=${builds}" >> "$GITHUB_OUTPUT"

  services-macos:
    needs: changes
    if: needs.changes.outputs.builds != '[]'
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.changes.outputs.builds) }}
        target:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Build and smoke-test ${{ matrix.build.kind }} ${{ matrix.build.version }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "scripts/build-${{ matrix.build.kind }}.sh" "${{ matrix.build.version }}" out

  # The macOS PHP build (oldest and newest minor) on pull requests that change it: built and
  # smoke-tested only, never released.
  php-macos:
    needs: changes
    if: needs.changes.outputs.php == 'true'
    # The called workflow names a release job that needs write access; with release: false it
    # never runs, but a caller must still allow what the called jobs ask for.
    permissions:
      contents: write
    uses: ./.github/workflows/macos.yml
    with:
      minors: '["8.1","8.5"]'
      release: false
