name: macos

# Builds PHP for macOS (cli + fpm, arm64 and x86_64) with static-php-cli and smoke-tests every build.
# The build jobs run third-party code (Homebrew packages, dependency build scripts) and therefore get
# a read-only token; a separate job with write access only receives the finished archives, uploads
# them to the release php-<version> and hands the catalog entries to the caller as the artifact
# macos-entries.

on:
  workflow_dispatch:
    inputs:
      minors:
        description: 'PHP minors as a JSON list'
        default: '["8.1","8.2","8.3","8.4","8.5"]'
  workflow_call:
    inputs:
      minors:
        type: string
        default: '["8.1","8.2","8.3","8.4","8.5"]'

permissions:
  contents: read

env:
  SPC_VERSION: '2.8.5'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(inputs.minors) }}
        target:
          - { runner: macos-15, arch: arm64, spc: spc-macos-aarch64.tar.gz, spc_sha256: acf2f25d56d0cbf8e65aa82e5054fef555f7be7c5c38046c6e0819f266d83225 }
          - { runner: macos-15-intel, arch: x86_64, spc: spc-macos-x86_64.tar.gz, spc_sha256: e8b798048f62ca4960764196543b60ae703f7174aa418824cf542aeec1d2cd6a }
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: static-php-cli (pinned, verified)
        run: |
          curl -fsSL -o spc.tar.gz "https://github.com/crazywhalecc/static-php-cli/releases/download/${SPC_VERSION}/${{ matrix.target.spc }}"
          echo "${{ matrix.target.spc_sha256 }}  spc.tar.gz" | shasum -a 256 -c -
          tar xzf spc.tar.gz && chmod +x spc && ./spc --version
          ./spc doctor --auto-fix
      - name: Build PHP ${{ matrix.php }}
        run: |
          EXT="$(tr -d '\n ' < build/extensions.txt)"
          # Sources only (no --prefer-pre-built): libraries are built here from their upstream sources.
          ./spc download --with-php=${{ matrix.php }} --for-extensions="$EXT,xdebug"
          ./spc build "$EXT" --build-cli --build-fpm --build-shared=xdebug
      - name: Package
        id: package
        run: |
          VERSION="$(buildroot/bin/php -r 'echo PHP_VERSION;')"
          DIR="php-$VERSION"
          mkdir -p "$DIR/bin" "$DIR/sbin" "$DIR/lib"
          cp buildroot/bin/php "$DIR/bin/php"
          cp buildroot/bin/php-fpm "$DIR/sbin/php-fpm"
          # Where spc puts shared extensions is not documented: take the one it built.
          cp "$(find buildroot -name xdebug.so | head -n 1)" "$DIR/lib/xdebug.so"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        env:
          DIR: ${{ steps.package.outputs.dir }}
        run: |
          "$DIR/bin/php" -v
          MODULES="$("$DIR/bin/php" -m | tr '[:upper:]' '[:lower:]')"
          for ext in $(tr ',' ' ' < build/extensions.txt); do
            name="$ext"; [ "$ext" = "opcache" ] && name="zend opcache"
            echo "$MODULES" | grep -qx "$name" || { echo "::error::$ext is missing"; exit 1; }
          done
          "$DIR/bin/php" -d "zend_extension=$PWD/$DIR/lib/xdebug.so" -v | grep -q Xdebug
          printf '[global]\nerror_log=/tmp/fpm.log\n[www]\nlisten=127.0.0.1:9999\npm=static\npm.max_children=1\n' > fpm.conf
          "$DIR/sbin/php-fpm" -t -y fpm.conf
      - name: Archive and catalog entry
        env:
          VERSION: ${{ steps.package.outputs.version }}
          DIR: ${{ steps.package.outputs.dir }}
        run: |
          mkdir out
          FILE="php-$VERSION-macos-${{ matrix.target.arch }}.tar.gz"
          tar czf "out/$FILE" "$DIR"
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/php-$VERSION/$FILE"
          node scripts/macos-entry.mjs entry "$VERSION" "${{ matrix.target.arch }}" "$URL" "out/$FILE" > out/entry.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.php }}-${{ matrix.target.arch }}
          path: out/

  release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: builds
      - name: Upload the archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in builds/*/php-*-macos-*.tar.gz; do
            name="$(basename "$file")"
            version="${name#php-}"; version="${version%-macos-*}"
            gh release view "php-$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
              || gh release create "php-$version" --repo "$GITHUB_REPOSITORY" --title "PHP $version for macOS" --notes "Built with static-php-cli $SPC_VERSION."
            gh release upload "php-$version" "$file" --repo "$GITHUB_REPOSITORY" --clobber
          done
      - run: node scripts/macos-entry.mjs merge macos-entries.json builds/*/entry.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-entries
          path: macos-entries.json
